<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | David Wei Xu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-brand">
            <a href="index.html">DW.X.</a>
        </div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="work.html">Work</a>
            <a href="about.html">About</a>
            <a href="contact.html" class="active">Contact</a>
        </div>
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark/light mode">
            <i class="fas fa-moon"></i>
        </button>
    </nav>

    <!-- Contact Header -->
    <header class="page-header">
        <h1 class="page-title">Get in Touch</h1>
        <p class="page-description">Have a project in mind? Let's talk.</p>
    </header>

    <!-- Contact Grid -->
    <main class="contact-grid">
        <aside class="contact-info-card">
            <address>
                <div class="contact-method">
                    <i class="fas fa-envelope"></i>
                    <div>
                        <h3>Email</h3>
                        <a href="mailto:xuweidavid27@gmail.com">xuweidavid27@gmail.com</a>
                    </div>
                </div>
                <div class="contact-method">
                    <i class="fab fa-github"></i>
                    <div>
                        <h3>GitHub</h3>
                        <a href="https://github.com/KamiZhiEND">/KamiZhiEND</a>
                    </div>
                </div>
                <div class="contact-method">
                    <i class="fab fa-linkedin"></i>
                    <div>
                        <h3>LinkedIn</h3>
                        <a href="https://www.linkedin.com/in/davidwx/">/in/davidwx</a>
                    </div>
                </div>
                <div class="contact-method">
                    <i class="fab fa-instagram"></i>
                    <div>
                        <h3>Instagram</h3>
                        <a href="#">/davidwx</a>
                    </div>
                </div>
            </address>
        </aside>

        <!-- Contact Form -->
        <form class="contact-form" id="contactForm">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="subject">Subject</label>
                <input type="text" id="subject" name="subject" required>
            </div>
            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5" required></textarea>
            </div>
            <button type="submit" class="btn-primary">Send Message →</button>
            <p class="form-note">*This is a demo form. In production, connect to a backend service.</p>
        </form>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-social">
            <a href="https://github.com/KamiZhiEND" aria-label="GitHub"><i class="fab fa-github"></i></a>
            <a href="https://www.linkedin.com/in/davidwx/" aria-label="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
            <a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
        </div>
        <p class="footer-copyright">© 2026 David Wei Xu</p>
    </footer>
</div>
</body>
</html>
